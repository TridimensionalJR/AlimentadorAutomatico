# JPA
# Statement logging for development only. Production inherits application.properties, which
# leaves both of these off.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Datasource - H2
# In-memory and non-persistent: the schema is rebuilt from the Flyway migrations on every start,
# so migrations can be edited freely while developing. The PostgreSQL driver is already declared
# in the build, so production only needs to override url, driver and credentials.
spring.datasource.url=jdbc:h2:mem:feederdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=feeder
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Auth
# Throwaway values so a fresh checkout and the test suite boot with no setup. Set GOOGLE_CLIENT_ID
# to a real client id to try the actual Google sign-in against a local front. The secret below is
# public in this repository: it must never reach a deployed environment, which is one more reason
# production must always set SPRING_PROFILES_ACTIVE explicitly rather than lean on the dev default.
app.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id.apps.googleusercontent.com}
app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
