# Application
spring.application.name=feeder
server.port=8080

# Defaults to the in-memory H2 profile so a fresh checkout runs with no external service.
# Production overrides it through the SPRING_PROFILES_ACTIVE environment variable.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

logging.file.path=logs

# JPA
# validate makes Hibernate compare the mapped entities against the live schema and refuse to
# start on a mismatch. Combined with Flyway below, the migrations are the single source of truth
# for the schema and Hibernate never issues CREATE or ALTER.
spring.jpa.hibernate.ddl-auto=validate

# Keeps the persistence context from living past the request. Without it a lazy association
# would quietly trigger a query after the response is being rendered; with it, anything not loaded
# inside the transaction fails loudly instead.
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Auth
# Sign-in is Google only: the front hands over a Google ID token, the backend verifies it and
# answers with its own JWT. Nothing secret lives in this file. Each value below is read from an
# environment variable and defaults to empty, so a missing one fails validation at startup with
# the property name in the message, instead of booting an instance that cannot authenticate (or,
# worse, one that signs tokens with a guessable key). The dev profile supplies throwaway values.
#
# OAuth client id of the web client created in Google Cloud Console. The same value must be
# configured in the front: it is what the token's audience is checked against.
app.google.client-id=${GOOGLE_CLIENT_ID:}
# HS256 signing key, at least 32 characters. Rotating it signs every user out.
app.jwt.secret=${JWT_SECRET:}
# Distinguishes this API's tokens from any other JWT, Google's included.
app.jwt.issuer=feeder
# There is no refresh token yet: when this elapses the front repeats the Google sign-in.
app.jwt.expiration=1h
# Comma-separated origins of the web app that may call this API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
